services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
  exam:
    build:
      context: .
      dockerfile: src/exam-service/Dockerfile
    environment:
      DB_DRIVER: postgres
      PGHOST: db
      PGPORT: "5432"
      PGUSER: heapexam
      PGDATABASE: heapexam
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      MATRIX_URL: "${MATRIX_URL:?Set MATRIX_URL}"
      EXAM_ADMIN_IDS: "${EXAM_ADMIN_IDS:?Set EXAM_ADMIN_IDS}"
      AI_PROVIDER: "${AI_PROVIDER:-disabled}"
      AI_MODEL: "${AI_MODEL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: heapexam
      POSTGRES_DB: heapexam
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - exam-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heapexam -d heapexam"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - exam
volumes:
  exam-postgres:
