events { worker_connections 1024; }
http {
    server {
        listen 80;
        client_max_body_size 15m;
        location /api/ {
            proxy_pass http://exam:3491;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://web:3490;
            proxy_set_header Host $host;
        }
    }
}
